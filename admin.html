<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>学习乐园 · 管理后台</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 独立后台页：不用主站的顶栏/侧栏布局，独立后台风格 */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:16px;-webkit-tap-highlight-color:transparent}
  button{background:none;border:none;cursor:pointer;font-family:inherit;color:inherit}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#eef2ff 0%,#f8fafc 40%,#f0f9ff 100%);
    color:#1e293b;min-height:100dvh;overflow-x:hidden;
    -webkit-user-select:none;user-select:none;
  }
  .content{width:100%;max-width:760px;margin:0 auto;padding:0 12px 48px}
</style>
</head>
<body>

<main class="content" id="app"></main>

<script>
  // 标记独立后台模式：admin.js 检测到后注册 window.initAdmin() 而不走 SPA 模块
  window.ADMIN_STANDALONE = true;
  // 提供 SPA 环境中的全局（admin.js 内部使用）
  window.$ = function(sel){ return document.getElementById(sel.replace(/^#/,'')); };
  window.registerModule = function(){};
</script>
<script src="modules/admin.js"></script>
<script>
  window.initAdmin();
</script>
</body>
</html>
