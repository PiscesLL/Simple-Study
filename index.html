<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>学习乐园</title>
<link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false">

<!-- ═══ MOBILE TOP NAV ═══ -->
<header class="topbar" id="topbar">
  <div class="topbar-row topbar-main">
    <button class="top-main active" data-nav="pinyin">🔤 拼音</button>
    <button class="top-main" data-nav="english">🔠 英语</button>
  </div>
  <div class="topbar-row topbar-subs" id="topbarSubs">
    <div data-nav-group="pinyin">
      <button class="top-leaf active" data-page="syllable-table">📊 音节表</button>
      <button class="top-leaf" data-page="listening">🆎 字母听读</button>
      <button class="top-leaf" data-page="dictation">✍️ 字母听写</button>
      <button class="top-leaf" data-page="memory-tricks">🧠 记忆技巧</button>
      <button class="top-leaf" data-page="study-plan">⚡ 快速复习</button>
      <button class="top-leaf" data-page="tones">🎵 声调练习</button>
      <button class="top-leaf" data-page="blending">🔗 拼读训练</button>
    </div>
    <div data-nav-group="english" style="display:none">
      <button class="top-leaf" data-page="alphabet">🃏 字母认读</button>
      <button class="top-leaf" data-page="writing">✏️ 字母书写</button>
    </div>
    <div style="display:flex;justify-content:flex-end;padding:4px 6px 2px;gap:6px">
      <button class="top-leaf" data-page="my-records" style="font-size:12px;opacity:.75;display:none">📊 我的学习</button>
      <button class="top-leaf" data-page="admin" style="font-size:12px;opacity:.75">🔧 学习记录</button>
    </div>
  </div>
</header>

<!-- ═══ DESKTOP SIDEBAR ═══ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-brand">📚 学习乐园</div>
    <div class="nav-tree">
      <!-- 🔤 拼音 -->
      <button class="nav-item nav-top active" data-nav="pinyin">🔤 拼音</button>
      <div class="nav-children" data-nav-group="pinyin">
        <button class="nav-item nav-leaf active" data-page="syllable-table">📊　音节表</button>
        <button class="nav-item nav-leaf" data-page="listening">🆎　字母听读</button>
        <button class="nav-item nav-leaf" data-page="dictation">✍️　字母听写</button>
        <button class="nav-item nav-leaf" data-page="memory-tricks">🧠　记忆技巧</button>
        <button class="nav-item nav-leaf" data-page="study-plan">⚡　快速复习</button>
        <button class="nav-item nav-leaf" data-page="tones">🎵　声调练习</button>
        <button class="nav-item nav-leaf" data-page="blending">🔗　拼读训练</button>
      </div>

      <!-- 🔠 英语 -->
      <button class="nav-item nav-top" data-nav="english">🔠 英语</button>
      <div class="nav-children" data-nav-group="english" style="display:none">
        <button class="nav-item nav-leaf" data-page="alphabet">🃏　字母认读</button>
        <button class="nav-item nav-leaf" data-page="writing">✏️　字母书写</button>
      </div>
    </div>
    <button class="nav-item nav-leaf" data-page="my-records" id="navMyRecords" style="display:none">📊　我的学习</button>
    <button class="nav-item nav-leaf" data-page="admin" style="border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding-top:10px">🔧　学习记录</button>
  </div>
</aside>

<!-- ═══ MAIN CONTENT ═══ -->
<main class="content" id="app"></main>

<!-- ═══ SCRIPTS ═══ -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="modules/auth.js"></script>
<script src="app.js"></script>
<script src="modules/syllable-table.js"></script>
<script src="modules/listening.js"></script>
<script src="modules/dictation.js"></script>
<script src="modules/study-plan.js"></script>
<script src="modules/diagnosis.js"></script>
<script src="modules/contrast.js"></script>
<script src="modules/practice.js"></script>
<script src="modules/review.js"></script>
<script src="modules/memory-tricks.js"></script>
<script src="modules/blending.js"></script>
<script src="modules/tones.js"></script>
<script src="modules/alphabet.js"></script>
<script src="modules/writing.js"></script>
<script src="modules/admin.js"></script>
<script src="modules/my-records.js"></script>
</body>
</html>
